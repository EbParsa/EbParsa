<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="shopeekBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1017" />
      <stop offset="100%" stop-color="#141a24" />
    </linearGradient>

    <!-- Glass Top Edge Highlight -->
    <linearGradient id="glassEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Chart Gradient Area Fill -->
    <linearGradient id="chartGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2997ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#2997ff" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2997ff" />
      <stop offset="100%" stop-color="#30d158" />
    </linearGradient>
  </defs>

  <style>
    .sf-mono {
      font-family: -apple-system, BlinkMacSystemFont, "SF Mono", "Fira Code", monospace;
    }
    .sf-pro {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", sans-serif;
    }
    .url-text {
      font-size: 11px;
      font-weight: 500;
      fill: #8b949e;
      letter-spacing: 0.3px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 700;
      fill: #f0f6fc;
      letter-spacing: -0.01em;
    }
    .badge-label {
      font-size: 10px;
      font-weight: 600;
      fill: #8b949e;
      letter-spacing: 0.5px;
    }
    .badge-val {
      font-size: 12px;
      font-weight: 700;
      fill: #f0f6fc;
    }
    .status-pill {
      font-size: 10px;
      font-weight: 600;
      fill: #30d158;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Card Body -->
  <rect width="600" height="220" rx="14" fill="url(#shopeekBg)" stroke="#30363d" stroke-width="1" />
  <path d="M 14 1 L 586 1" stroke="url(#glassEdge)" stroke-width="1.5" />

  <!-- Safari / macOS Window Chrome -->
  <g transform="translate(18, 14)">
    <!-- Traffic lights -->
    <circle cx="8" cy="8" r="5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
    <circle cx="24" cy="8" r="5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
    <circle cx="40" cy="8" r="5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

    <!-- Address Bar -->
    <g transform="translate(70, -2)">
      <rect width="320" height="20" rx="5" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
      <path d="M 14 7 L 14 6 C 14 4.3 15.3 3 17 3 C 18.7 3 20 4.3 20 6 L 20 7 M 12 7 L 22 7 L 22 13 L 12 13 Z" fill="none" stroke="#30d158" stroke-width="1" />
      <text x="28" y="14" class="sf-mono url-text">https://<tspan fill="#f0f6fc" font-weight="700">shopeekapp.ir</tspan></text>
    </g>

    <!-- Live Status Pill -->
    <g transform="translate(420, -2)">
      <rect width="144" height="20" rx="10" fill="rgba(48, 209, 88, 0.1)" stroke="rgba(48, 209, 88, 0.3)" stroke-width="0.8" />
      <circle cx="12" cy="10" r="3" fill="#30d158" />
      <text x="22" y="14" class="sf-mono status-pill">LIVE PRODUCTION</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="0" y1="44" x2="600" y2="44" stroke="#21262d" stroke-width="1" />

  <!-- Content Section -->
  <g transform="translate(24, 60)">
    <!-- Title & Subtitle -->
    <text x="0" y="16" class="sf-pro card-title">Shopeek (شاپیک)</text>
    <text x="0" y="34" class="sf-pro" font-size="12px" fill="#8b949e">Persian RTL Sales-Analytics &amp; Commerce Platform · Monorepo SaaS</text>

    <!-- Analytics Curve Graph (Visual Demo) -->
    <g transform="translate(0, 52)">
      <!-- Background grid lines -->
      <line x1="0" y1="20" x2="310" y2="20" stroke="#21262d" stroke-dasharray="3 3" />
      <line x1="0" y1="50" x2="310" y2="50" stroke="#21262d" stroke-dasharray="3 3" />
      <line x1="0" y1="80" x2="310" y2="80" stroke="#21262d" />

      <!-- Area fill -->
      <path d="M 0 75 Q 60 70, 110 45 T 210 30 T 310 8 L 310 80 L 0 80 Z" fill="url(#chartGradient)" />
      <!-- Line curve -->
      <path d="M 0 75 Q 60 70, 110 45 T 210 30 T 310 8" fill="none" stroke="#2997ff" stroke-width="2" />
      
      <!-- Highlight point -->
      <circle cx="310" cy="8" r="4" fill="#2997ff" />
      <circle cx="310" cy="8" r="7" fill="none" stroke="#2997ff" stroke-opacity="0.4" />
      <text x="238" y="0" class="sf-mono" font-size="10px" font-weight="700" fill="#30d158">+34.2% MRR</text>
    </g>

    <!-- Right Side Metrics & Architecture Badges -->
    <g transform="translate(340, 48)">
      <!-- Metric 1: Multi-Account & RTL UX -->
      <g transform="translate(0, 0)">
        <rect width="212" height="32" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
        <text x="12" y="14" class="sf-mono badge-label">FRONTEND STACK</text>
        <text x="12" y="26" class="sf-pro badge-val">React 19 · Vite 8 · Tailwind · RTL</text>
      </g>

      <!-- Metric 2: Backend Architecture -->
      <g transform="translate(0, 38)">
        <rect width="212" height="32" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
        <text x="12" y="14" class="sf-mono badge-label">BACKEND &amp; SCHEDULER</text>
        <text x="12" y="26" class="sf-pro badge-val">FastAPI · asyncpg · Supabase</text>
      </g>

      <!-- Metric 3: AI Assistant -->
      <g transform="translate(0, 76)">
        <rect width="212" height="32" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
        <text x="12" y="14" class="sf-mono badge-label">STREAMING ENGINE</text>
        <text x="12" y="26" class="sf-pro badge-val">Live LLM Advisory &amp; Billing Sweep</text>
      </g>
    </g>
  </g>
</svg>
