<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0a0d12" />
    </linearGradient>

    <!-- Glow & Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" />
      <stop offset="50%" stop-color="#bb9af7" />
      <stop offset="100%" stop-color="#7dcfff" />
    </linearGradient>

    <linearGradient id="subtleLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0" />
      <stop offset="50%" stop-color="#7aa2f7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#bb9af7" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="radialCyan" cx="85%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#7dcfff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#7dcfff" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="radialPurple" cx="15%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#bb9af7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#bb9af7" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363d" stroke-width="0.7" stroke-opacity="0.45" />
      <circle cx="40" cy="40" r="1" fill="#7aa2f7" fill-opacity="0.3" />
    </pattern>

    <!-- Drop Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .name-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 54px;
      font-weight: 800;
      letter-spacing: 6px;
      fill: #f0f6fc;
    }
    .role-text {
      font-family: "SF Mono", "Fira Code", "Roboto Mono", Menlo, monospace;
      font-size: 19px;
      font-weight: 500;
      letter-spacing: 2.5px;
      fill: #7aa2f7;
    }
    .desc-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 15px;
      font-weight: 400;
      fill: #8b949e;
      letter-spacing: 0.5px;
    }
    .badge-pill {
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 12px;
      font-weight: 600;
      fill: #c9d1d9;
    }
    .status-text {
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 12px;
      fill: #7ee787;
      letter-spacing: 1px;
    }
  </style>

  <!-- Card Background -->
  <rect width="1200" height="280" rx="16" fill="url(#bgGradient)" stroke="#30363d" stroke-width="1.5" />

  <!-- Ambient Light Overlays -->
  <rect width="1200" height="280" rx="16" fill="url(#radialCyan)" />
  <rect width="1200" height="280" rx="16" fill="url(#radialPurple)" />

  <!-- Grid Pattern Overlay -->
  <rect width="1200" height="280" rx="16" fill="url(#grid)" />

  <!-- Accent Border Top Bar -->
  <path d="M 16 0 L 1184 0" stroke="url(#primaryGlow)" stroke-width="3" />

  <!-- Content Layout -->
  <g transform="translate(70, 0)">
    <!-- Terminal / Status Indicator -->
    <g transform="translate(0, 48)">
      <circle cx="6" cy="6" r="4.5" fill="#238636" />
      <circle cx="6" cy="6" r="8" fill="#2ea043" fill-opacity="0.3">
        <animate attributeName="r" values="6;10;6" dur="3s" repeatCount="indefinite" />
        <animate attributeName="fill-opacity" values="0.4;0.05;0.4" dur="3s" repeatCount="indefinite" />
      </circle>
      <text x="24" y="10" class="status-text">SYSTEM ACTIVE // BUILDING THE FUTURE</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 115)">
      <text x="0" y="0" class="name-title">PARSA EBRAHIMI</text>
    </g>

    <!-- Subtitle / Role -->
    <g transform="translate(0, 155)">
      <text x="0" y="0" class="role-text">&gt; ROBOTICS, SYSTEMS &amp; FULL-STACK ENGINEER</text>
    </g>

    <!-- Description / Core focus -->
    <g transform="translate(0, 192)">
      <text x="0" y="0" class="desc-text">Cable-driven robotics & AI · Zero-dependency SDKs · Scalable enterprise web architectures</text>
    </g>

    <!-- Tech Pills -->
    <g transform="translate(0, 222)">
      <!-- Pill 1: Rust -->
      <g transform="translate(0, 0)">
        <rect width="78" height="26" rx="6" fill="#1f242c" stroke="#38444d" stroke-width="1" />
        <text x="39" y="17" text-anchor="middle" class="badge-pill">🦀 RUST</text>
      </g>
      <!-- Pill 2: TypeScript -->
      <g transform="translate(88, 0)">
        <rect width="124" height="26" rx="6" fill="#1f242c" stroke="#38444d" stroke-width="1" />
        <text x="62" y="17" text-anchor="middle" class="badge-pill">⚡ TYPESCRIPT</text>
      </g>
      <!-- Pill 3: Python -->
      <g transform="translate(222, 0)">
        <rect width="94" height="26" rx="6" fill="#1f242c" stroke="#38444d" stroke-width="1" />
        <text x="47" y="17" text-anchor="middle" class="badge-pill">🐍 PYTHON</text>
      </g>
      <!-- Pill 4: Next.js -->
      <g transform="translate(326, 0)">
        <rect width="102" height="26" rx="6" fill="#1f242c" stroke="#38444d" stroke-width="1" />
        <text x="51" y="17" text-anchor="middle" class="badge-pill">▲ NEXT.JS</text>
      </g>
      <!-- Pill 5: Engines & SDKs -->
      <g transform="translate(438, 0)">
        <rect width="180" height="26" rx="6" fill="#1f242c" stroke="#38444d" stroke-width="1" />
        <text x="90" y="17" text-anchor="middle" class="badge-pill">🤖 ROBOTICS &amp; SDKs</text>
      </g>
    </g>
  </g>

  <!-- Right Decorative Geometric Element -->
  <g transform="translate(980, 50)" opacity="0.6">
    <!-- Concentric geometric rings -->
    <circle cx="80" cy="80" r="70" fill="none" stroke="#7aa2f7" stroke-width="1" stroke-dasharray="6 6" />
    <circle cx="80" cy="80" r="48" fill="none" stroke="#bb9af7" stroke-width="1.2" />
    <circle cx="80" cy="80" r="24" fill="none" stroke="#7dcfff" stroke-width="1.5" stroke-dasharray="3 3" />
    <circle cx="80" cy="80" r="5" fill="#7aa2f7" />
    
    <!-- Coordinate crosshairs -->
    <line x1="80" y1="0" x2="80" y2="160" stroke="#30363d" stroke-width="0.8" />
    <line x1="0" y1="80" x2="160" y2="80" stroke="#30363d" stroke-width="0.8" />

    <!-- Corner brackets -->
    <path d="M 0 20 L 0 0 L 20 0" fill="none" stroke="#7aa2f7" stroke-width="1.8" />
    <path d="M 140 0 L 160 0 L 160 20" fill="none" stroke="#7aa2f7" stroke-width="1.8" />
    <path d="M 0 140 L 0 160 L 20 160" fill="none" stroke="#7aa2f7" stroke-width="1.8" />
    <path d="M 140 160 L 160 160 L 160 140" fill="none" stroke="#7aa2f7" stroke-width="1.8" />
  </g>

  <!-- Bottom Accent Separator -->
  <line x1="100" y1="279" x2="1100" y2="279" stroke="url(#subtleLine)" stroke-width="1" />
</svg>
