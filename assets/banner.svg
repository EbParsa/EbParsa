<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Deep Obsidian) -->
    <linearGradient id="appleBgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c11" />
      <stop offset="50%" stop-color="#0f151e" />
      <stop offset="100%" stop-color="#0b1017" />
    </linearGradient>

    <!-- Glass Top Edge Highlight -->
    <linearGradient id="appleGlassEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2997ff" stop-opacity="0" />
      <stop offset="30%" stop-color="#2997ff" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#bf5af2" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#bf5af2" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Ambient Radial Lights -->
    <radialGradient id="radialBlue" cx="40%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#2997ff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#2997ff" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="radialPurple" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#bf5af2" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#bf5af2" stop-opacity="0" />
    </radialGradient>

    <!-- Dot Matrix Pattern -->
    <pattern id="dotGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="0.8" fill="#30363d" fill-opacity="0.5" />
    </pattern>
  </defs>

  <style>
    .name-title {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", sans-serif;
      font-size: 52px;
      font-weight: 800;
      letter-spacing: -0.025em;
      fill: #f0f6fc;
    }
    .role-text {
      font-family: -apple-system, BlinkMacSystemFont, "SF Mono", "Fira Code", monospace;
      font-size: 16.5px;
      font-weight: 600;
      letter-spacing: 2px;
      fill: #2997ff;
    }
    .desc-text {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif;
      font-size: 14.5px;
      font-weight: 400;
      fill: #8b949e;
      letter-spacing: 0.2px;
    }
    .badge-pill {
      font-family: -apple-system, BlinkMacSystemFont, "SF Mono", "Fira Code", monospace;
      font-size: 11.5px;
      font-weight: 600;
      fill: #e6edf3;
      letter-spacing: 0.3px;
    }
    .status-text {
      font-family: -apple-system, BlinkMacSystemFont, "SF Mono", monospace;
      font-size: 11.5px;
      font-weight: 600;
      fill: #30d158;
      letter-spacing: 1.2px;
    }
  </style>

  <!-- Card Background -->
  <rect width="1200" height="280" rx="16" fill="url(#appleBgGradient)" stroke="#30363d" stroke-width="1.2" />

  <!-- Ambient Light Overlays -->
  <rect width="1200" height="280" rx="16" fill="url(#radialBlue)" />
  <rect width="1200" height="280" rx="16" fill="url(#radialPurple)" />

  <!-- Dot Grid Pattern -->
  <rect width="1200" height="280" rx="16" fill="url(#dotGrid)" />

  <!-- Accent Top Edge -->
  <path d="M 16 1 L 1184 1" stroke="url(#appleGlassEdge)" stroke-width="2" />

  <!-- Content Layout -->
  <g transform="translate(68, 0)">
    <!-- Terminal / Status Indicator -->
    <g transform="translate(0, 44)">
      <circle cx="6" cy="6" r="4.5" fill="#30d158" />
      <circle cx="6" cy="6" r="8" fill="#30d158" fill-opacity="0.25">
        <animate attributeName="r" values="5;9;5" dur="3s" repeatCount="indefinite" />
        <animate attributeName="fill-opacity" values="0.3;0.05;0.3" dur="3s" repeatCount="indefinite" />
      </circle>
      <text x="24" y="10" class="status-text">SYSTEM ACTIVE // CRAFTING RESILIENT ARCHITECTURES</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 110)">
      <text x="0" y="0" class="name-title">PARSA EBRAHIMI</text>
    </g>

    <!-- Subtitle / Role -->
    <g transform="translate(0, 148)">
      <text x="0" y="0" class="role-text">&gt; ROBOTICS, SYSTEMS &amp; FULL-STACK ENGINEER</text>
    </g>

    <!-- Description / Core focus -->
    <g transform="translate(0, 184)">
      <text x="0" y="0" class="desc-text">Cable-driven robotics &amp; AI · Zero-dependency SDKs · Scalable enterprise web architectures</text>
    </g>

    <!-- Apple-Style Translucent Tech Pills -->
    <g transform="translate(0, 216)">
      <!-- Pill 1: Robotics & Kinematics -->
      <g transform="translate(0, 0)">
        <rect width="186" height="28" rx="7" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="93" y="18" text-anchor="middle" class="badge-pill">🤖 ROBOTICS &amp; KINEMATICS</text>
      </g>
      <!-- Pill 2: Telemetry SDKs -->
      <g transform="translate(196, 0)">
        <rect width="154" height="28" rx="7" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="77" y="18" text-anchor="middle" class="badge-pill">⚡ TELEMETRY SDKs</text>
      </g>
      <!-- Pill 3: Full-Stack Systems -->
      <g transform="translate(360, 0)">
        <rect width="176" height="28" rx="7" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="88" y="18" text-anchor="middle" class="badge-pill">▲ FULL-STACK SYSTEMS</text>
      </g>
      <!-- Pill 4: Python & Rust -->
      <g transform="translate(546, 0)">
        <rect width="144" height="28" rx="7" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="72" y="18" text-anchor="middle" class="badge-pill">🐍 PYTHON &amp; RUST</text>
      </g>
      <!-- Pill 5: WebGPU Twins -->
      <g transform="translate(700, 0)">
        <rect width="140" height="28" rx="7" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="70" y="18" text-anchor="middle" class="badge-pill">🌐 WEBGPU TWINS</text>
      </g>
    </g>
  </g>

  <!-- Right Decorative Element: Precision Apple-Style Concentric Rings -->
  <g transform="translate(980, 50)" opacity="0.75">
    <circle cx="80" cy="80" r="76" fill="none" stroke="#2997ff" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4 4" />
    <circle cx="80" cy="80" r="54" fill="none" stroke="#bf5af2" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="80" cy="80" r="28" fill="none" stroke="#30d158" stroke-width="1.4" stroke-opacity="0.7" stroke-dasharray="2 2" />
    <circle cx="80" cy="80" r="5" fill="#2997ff" />
    
    <!-- Coordinate crosshairs -->
    <line x1="80" y1="0" x2="80" y2="160" stroke="#30363d" stroke-width="0.8" />
    <line x1="0" y1="80" x2="160" y2="80" stroke="#30363d" stroke-width="0.8" />

    <!-- Corner Brackets -->
    <path d="M 0 16 L 0 0 L 16 0" fill="none" stroke="#2997ff" stroke-width="1.5" stroke-opacity="0.6" />
    <path d="M 144 0 L 160 0 L 160 16" fill="none" stroke="#2997ff" stroke-width="1.5" stroke-opacity="0.6" />
    <path d="M 0 144 L 0 160 L 16 160" fill="none" stroke="#2997ff" stroke-width="1.5" stroke-opacity="0.6" />
    <path d="M 144 160 L 160 160 L 160 144" fill="none" stroke="#2997ff" stroke-width="1.5" stroke-opacity="0.6" />
  </g>
</svg>
