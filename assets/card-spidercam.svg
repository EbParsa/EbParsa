<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="spiderBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d13" />
      <stop offset="50%" stop-color="#0f1520" />
      <stop offset="100%" stop-color="#141c2b" />
    </linearGradient>

    <!-- Glass Top Edge Highlight -->
    <linearGradient id="spiderGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Glow for Cables -->
    <filter id="cableGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .sf-mono {
      font-family: -apple-system, BlinkMacSystemFont, "SF Mono", "Fira Code", monospace;
    }
    .sf-pro {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", sans-serif;
    }
    .main-title {
      font-size: 20px;
      font-weight: 700;
      fill: #f0f6fc;
      letter-spacing: -0.01em;
    }
    .sub-title {
      font-size: 13px;
      fill: #8b949e;
      letter-spacing: 0.2px;
    }
    .spec-header {
      font-size: 10.5px;
      font-weight: 600;
      fill: #2997ff;
      letter-spacing: 1px;
    }
    .spec-body {
      font-size: 12px;
      font-weight: 600;
      fill: #f0f6fc;
    }
    .status-text {
      font-size: 10px;
      font-weight: 700;
      fill: #30d158;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Card Body -->
  <rect width="1200" height="240" rx="14" fill="url(#spiderBg)" stroke="#30363d" stroke-width="1" />
  <path d="M 14 1 L 1186 1" stroke="url(#spiderGlass)" stroke-width="1.5" />

  <!-- Top Window Chrome / Bar -->
  <g transform="translate(24, 16)">
    <!-- Traffic lights -->
    <circle cx="8" cy="8" r="5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
    <circle cx="24" cy="8" r="5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
    <circle cx="40" cy="8" r="5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

    <!-- Title in bar -->
    <text x="64" y="12" class="sf-mono" font-size="11px" font-weight="600" fill="#8b949e">
      spidercam/robotics_core.py · 60 FPS WebGPU Digital Twin
    </text>

    <!-- Status pill -->
    <g transform="translate(970, -2)">
      <rect width="180" height="20" rx="10" fill="rgba(48, 209, 88, 0.12)" stroke="rgba(48, 209, 88, 0.35)" stroke-width="0.8" />
      <circle cx="12" cy="10" r="3" fill="#30d158" />
      <text x="22" y="14" class="sf-mono status-text">CDPR KINEMATICS SOLVER</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="0" y1="46" x2="1200" y2="46" stroke="#21262d" stroke-width="1" />

  <!-- Content Section -->
  <g transform="translate(36, 68)">
    <!-- 3D CDPR Wireframe Simulation (Left Column: 0 to 280) -->
    <g transform="translate(20, 10)">
      <!-- Stadium / Room Outer Wireframe Box -->
      <polygon points="10,20 180,10 240,60 70,70" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="3 3" />
      <polygon points="10,130 180,120 240,150 70,160" fill="none" stroke="#21262d" stroke-width="1" />
      
      <!-- Vertical Columns -->
      <line x1="10" y1="20" x2="10" y2="130" stroke="#30363d" stroke-width="1" stroke-dasharray="2 2" />
      <line x1="180" y1="10" x2="180" y2="120" stroke="#30363d" stroke-width="1" stroke-dasharray="2 2" />
      <line x1="240" y1="60" x2="240" y2="150" stroke="#30363d" stroke-width="1" />
      <line x1="70" y1="70" x2="70" y2="160" stroke="#30363d" stroke-width="1" />

      <!-- Corner Pulleys -->
      <circle cx="10" cy="20" r="3" fill="#2997ff" />
      <circle cx="180" cy="10" r="3" fill="#2997ff" />
      <circle cx="240" cy="60" r="3" fill="#2997ff" />
      <circle cx="70" cy="70" r="3" fill="#2997ff" />

      <!-- End Effector Center Platform (X: 130, Y: 85) -->
      <rect x="118" y="78" width="24" height="14" rx="3" fill="#1f242c" stroke="#2997ff" stroke-width="1.2" />
      <circle cx="130" cy="85" r="2.5" fill="#30d158" />

      <!-- 4 Suspension Cables with Catenary Tension -->
      <line x1="10" y1="20" x2="118" y2="78" stroke="#2997ff" stroke-width="1.2" stroke-opacity="0.8" />
      <line x1="180" y1="10" x2="142" y2="78" stroke="#2997ff" stroke-width="1.2" stroke-opacity="0.8" />
      <line x1="240" y1="60" x2="142" y2="92" stroke="#2997ff" stroke-width="1.2" stroke-opacity="0.8" />
      <line x1="70" y1="70" x2="118" y2="92" stroke="#2997ff" stroke-width="1.2" stroke-opacity="0.8" />

      <!-- Coordinate Triad at Platform -->
      <line x1="130" y1="85" x2="130" y2="60" stroke="#ff5f56" stroke-width="1.5" /> <!-- Z: Red -->
      <line x1="130" y1="85" x2="155" y2="85" stroke="#27c93f" stroke-width="1.5" /> <!-- X: Green -->
      <line x1="130" y1="85" x2="115" y2="100" stroke="#2997ff" stroke-width="1.5" /> <!-- Y: Blue -->

      <!-- Caption -->
      <text x="130" y="152" text-anchor="middle" class="sf-mono" font-size="9.5px" fill="#8b949e">
        CDPR 4-Cable Tension Mesh
      </text>
    </g>

    <!-- Center Column: Project Identity & Physics Solvers (320 to 760) -->
    <g transform="translate(320, 0)">
      <text x="0" y="20" class="sf-pro main-title">SpiderCam Robotics &amp; AI Cinematography</text>
      <text x="0" y="38" class="sf-pro sub-title">
        From-scratch Python implementation of Cable-Driven Parallel Robots (CDPR) with WebGPU simulation.
      </text>

      <!-- 2x2 Feature Grid -->
      <g transform="translate(0, 56)">
        <!-- Tile 1: Kinematics -->
        <g transform="translate(0, 0)">
          <rect width="200" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
          <text x="12" y="15" class="sf-mono spec-header">KINEMATICS CORE</text>
          <text x="12" y="30" class="sf-pro spec-body">Forward &amp; Inverse (IK/FK)</text>
        </g>

        <!-- Tile 2: Catenary Sag -->
        <g transform="translate(212, 0)">
          <rect width="200" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
          <text x="12" y="15" class="sf-mono spec-header">PHYSICS MODEL</text>
          <text x="12" y="30" class="sf-pro spec-body">Irvine Catenary + Elasticity</text>
        </g>

        <!-- Tile 3: QP Solver -->
        <g transform="translate(0, 48)">
          <rect width="200" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
          <text x="12" y="15" class="sf-mono spec-header">TENSION SOLVER</text>
          <text x="12" y="30" class="sf-pro spec-body">Quadratic Programming (QP)</text>
        </g>

        <!-- Tile 4: Anti-Sway -->
        <g transform="translate(212, 48)">
          <rect width="200" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
          <text x="12" y="15" class="sf-mono spec-header">VIBRATION DAMPING</text>
          <text x="12" y="30" class="sf-pro spec-body">Singer–Seering Input Shaping</text>
        </g>
      </g>
    </g>

    <!-- Right Column: AI Director & Twin Capabilities (770 to 1120) -->
    <g transform="translate(770, 0)">
      <g transform="translate(0, 10)">
        <!-- Capability 1 -->
        <g transform="translate(0, 0)">
          <rect width="360" height="42" rx="7" fill="#131922" stroke="#30363d" stroke-width="0.8" />
          <circle cx="20" cy="21" r="5" fill="#2997ff" />
          <text x="36" y="17" class="sf-mono" font-size="10px" font-weight="700" fill="#2997ff">AI CINEMATOGRAPHY ENGINE</text>
          <text x="36" y="32" class="sf-pro" font-size="11.5px" fill="#c9d1d9">Rule of thirds, headroom, and RL trajectory tracking</text>
        </g>

        <!-- Capability 2 -->
        <g transform="translate(0, 48)">
          <rect width="360" height="42" rx="7" fill="#131922" stroke="#30363d" stroke-width="0.8" />
          <circle cx="20" cy="21" r="5" fill="#30d158" />
          <text x="36" y="17" class="sf-mono" font-size="10px" font-weight="700" fill="#30d158">THREE.JS + WEBGPU TWIN</text>
          <text x="36" y="32" class="sf-pro" font-size="11.5px" fill="#c9d1d9">Real-time browser visual twin &amp; synthetic training export</text>
        </g>

        <!-- Capability 3 -->
        <g transform="translate(0, 96)">
          <rect width="360" height="42" rx="7" fill="#131922" stroke="#30363d" stroke-width="0.8" />
          <circle cx="20" cy="21" r="5" fill="#bf5af2" />
          <text x="36" y="17" class="sf-mono" font-size="10px" font-weight="700" fill="#bf5af2">ARCHITECTURE &amp; STANDARDS</text>
          <text x="36" y="32" class="sf-pro" font-size="11.5px" fill="#c9d1d9">ROS CDPR convention · Modular bus · Hardware HAL</text>
        </g>
      </g>
    </g>
  </g>
</svg>
